[project]
name = "complaint-eval-harness"
version = "0.1.0"
description = "Chapter 11 (customer-care edition): evaluation harness for the complaint-resolution agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "numpy>=1.26",
    "scipy>=1.12",
    "pyyaml>=6.0",
    "anthropic>=1.17",
    "openai>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]
# Production observability/eval layer discussed in the chapter;
# not required to run the self-contained lab harness.
production = ["langfuse>=2.40", "deepeval>=1.0"]

[project.scripts]
complaint-eval = "src.eval_harness.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
